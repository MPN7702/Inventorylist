<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eManager Inventory Count Generator</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    margin:20px;
    background:#f4f4f4;
}

h1{
    color:#003366;
}

.container{
    background:white;
    padding:20px;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

textarea{
    width:100%;
    font-family:Consolas,monospace;
    font-size:13px;
}

#inputData{
    height:300px;
}

#output{
    height:400px;
}

input{
    width:100%;
    padding:10px;
    margin-bottom:10px;
}

button{
    padding:10px 20px;
    margin-right:10px;
    margin-bottom:10px;
    cursor:pointer;
    background:#0066cc;
    color:white;
    border:none;
    border-radius:5px;
}

button:hover{
    background:#0050a0;
}

.test-btn{
    background:#198754;
}

.test-btn:hover{
    background:#146c43;
}

.prod-btn{
    background:#dc3545;
}

.prod-btn:hover{
    background:#bb2d3b;
}

.info{
    margin-top:10px;
    font-weight:bold;
}

#statusBox{
    margin-top:15px;
    padding:10px;
    background:#f8f9fa;
    border:1px solid #ddd;
    border-radius:5px;
    white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="container">

<h1>eManager Inventory Count Generator</h1>

<label>ReferenceName</label>
<input type="text" id="referenceName" value="COUNT_20261103">

<label>Klistra in data från Excel</label>

<textarea id="inputData" placeholder="Klistra in kolumnerna:
Item number
Batch number
Serial number"></textarea>

<br><br>

<button onclick="generateJson()">Generera JSON</button>

<button onclick="copyJson()">Kopiera kod</button>

<button onclick="clearData()">Rensa data</button>

<button class="test-btn" onclick="sendToTest()">Skicka till TEST</button>

<button class="prod-btn" onclick="sendToProd()">Skicka till PROD</button>

<div class="info" id="rowCount"></div>

<br>

<label>JSON</label>

<textarea id="output"></textarea>

<div id="statusBox">Status visas här...</div>

</div>

<script>

function generateJson(){

    const referenceName =
        document.getElementById("referenceName").value.trim();

    const text =
        document.getElementById("inputData").value;

    const lines =
        text.split(/\r?\n/);

    let inventoryLines=[];

    for(let i=0;i<lines.length;i++){

        let row = lines[i].trim();

        if(!row)
            continue;

        let cols = row.split(/\t+/);

        if(cols.length < 1)
            continue;

        let itemNumber = cols[0]?.trim();
        let batchNumber = cols[1]?.trim();
        let serialNumber = cols[2]?.trim();

        if(!itemNumber)
            continue;

        if(itemNumber.toLowerCase().includes("item"))
            continue;

        let obj = {
            ReferenceName: referenceName,
            ExtProductId: itemNumber
        };

        if(batchNumber)
            obj.BatchId = batchNumber;

        if(serialNumber)
            obj.StockReservationKey = serialNumber;

        inventoryLines.push(obj);
    }

    let finalJson = {
        ImportOperation:{
            Lines:{
                InventoryLine: inventoryLines
            }
        }
    };

    document.getElementById("output").value =
        JSON.stringify(finalJson,null,2);

    document.getElementById("rowCount").innerHTML =
        "Antal inventeringsrader: " +
        inventoryLines.length;
}

function copyJson(){

    let output =
        document.getElementById("output");

    output.select();

    navigator.clipboard.writeText(output.value);

    alert("Kod kopierad!");
}

function clearData(){

    document.getElementById("inputData").value = "";
    document.getElementById("output").value = "";
    document.getElementById("rowCount").innerHTML = "";
    document.getElementById("statusBox").innerHTML =
        "Status visas här...";
}

async function sendRequest(url){

    const jsonText =
        document.getElementById("output").value;

    if(!jsonText){
        alert("Generera JSON först.");
        return;
    }

    const username =
        prompt("eManager användarnamn:");

    if(!username)
        return;

    const password =
        prompt("eManager lösenord:");

    if(!password)
        return;

    document.getElementById("statusBox").innerHTML =
        "Skickar...";

    try{

        const response = await fetch(url,{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":"Basic " +
                    btoa(username + ":" + password)
            },
            body:jsonText
        });

        const responseText =
            await response.text();

        document.getElementById("statusBox").innerHTML =
            "Status: " +
            response.status +
            "\n\n" +
            responseText;

    }
    catch(error){

        document.getElementById("statusBox").innerHTML =
            "Fel:\n\n" +
            error +
            "\n\nOm detta är ett CORS-fel måste eManager servern tillåta anrop från GitHub Pages.";

    }
}

function sendToTest(){

    sendRequest(
        "http://SETOSASP007/api/inventorycounts/import"
    );

}

function sendToProd(){

    const answer =
        confirm(
            "Är du säker på att du vill skicka till PRODUKTION?"
        );

    if(!answer)
        return;

    sendRequest(
        "http://SETOSASP006/api/inventorycounts/import"
    );

}

</script>

</body>
</html>
