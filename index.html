<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eManager Inventory Count Generator</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    margin:20px;
    background:#f4f4f4;
}

h1{
    color:#003366;
}

.container{
    background:white;
    padding:20px;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

input{
    width:100%;
    padding:10px;
    margin-bottom:10px;
}

textarea{
    width:100%;
    font-family:Consolas,monospace;
    font-size:13px;
}

#inputData{
    height:300px;
}

#output{
    height:400px;
}

button{
    padding:10px 20px;
    margin-right:10px;
    margin-bottom:10px;
    cursor:pointer;
    background:#0066cc;
    color:white;
    border:none;
    border-radius:5px;
}

button:hover{
    background:#0050a0;
}

.info{
    margin-top:10px;
    font-weight:bold;
}

.headerRow{
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    background:#efefef;
    border:1px solid #ccc;
    padding:8px;
    font-weight:bold;
    margin-bottom:5px;
    font-family:Consolas,monospace;
}
</style>
</head>

<body>

<div class="container">

<h1>eManager Inventory Count Generator</h1>

<label>ReferenceName</label>
<input type="text" id="referenceName" value="COUNT_20261103">

<label>Klistra in Excel-data</label>

<div class="headerRow">
    <div>Item number</div>
    <div>Batch number</div>
    <div>Serial number</div>
</div>

<textarea id="inputData" placeholder="Item number	Batch number	Serial number

1010-1750		MBB02070C1001FC100
2015-3630	4PO-091976-10	
8600-5856"></textarea>

<br><br>

<button onclick="generateJson()">Generera JSON</button>

<button onclick="copyJson()">Kopiera kod</button>

<button onclick="clearData()">Rensa data</button>

<div class="info" id="rowCount"></div>

<br>

<label>JSON</label>

<textarea id="output"></textarea>

</div>

<script>

function generateJson(){

    const referenceName =
        document.getElementById("referenceName").value.trim();

    const text =
        document.getElementById("inputData").value;

    const rows =
        text.split(/\r?\n/);

    let inventoryLines = [];

    for(let i = 0; i < rows.length; i++){

        const row = rows[i];

        if(!row.trim())
            continue;

        const cols = row.split("\t");

        const itemNumber =
            (cols[0] || "").trim();

        const batchNumber =
            (cols[1] || "").trim();

        const serialNumber =
            (cols[2] || "").trim();

        if(!itemNumber)
            continue;

        if(itemNumber.toLowerCase() === "item number")
            continue;

        const obj = {
            ReferenceName: referenceName,
            ExtProductId: itemNumber
        };

        if(batchNumber !== "")
            obj.BatchId = batchNumber;

        if(serialNumber !== "")
            obj.StockReservationKey = serialNumber;

        inventoryLines.push(obj);
    }

    const finalJson = {
        ImportOperation:{
            Lines:{
                InventoryLine: inventoryLines
            }
        }
    };

    document.getElementById("output").value =
        JSON.stringify(finalJson, null, 2);

    document.getElementById("rowCount").innerHTML =
        "Antal inventeringsrader: " +
        inventoryLines.length;
}

function copyJson(){

    const output =
        document.getElementById("output");

    navigator.clipboard.writeText(output.value);

    alert("Kod kopierad!");
}

function clearData(){

    document.getElementById("inputData").value = "";
    document.getElementById("output").value = "";
    document.getElementById("rowCount").innerHTML = "";
}

</script>

</body>
</html>
